# XFC: Windows + Android (64 & 32 bit), GD 2.2074 / Geode 4.10.0
name: Build XFC 2.2.9

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64
          - name: Android64
            os: ubuntu-latest
            target: Android64
          - name: Android32
            os: ubuntu-latest
            target: Android32

    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v4.10.0
          bindings: geode-sdk/bindings
          bindings-ref: c949aeae063175eca528b33cf8f5b573935b0079
          target: ${{ matrix.config.target }}
          combine: true

      # per-platform file, so a failed platform never blocks the others
      - name: Upload ${{ matrix.config.name }}
        uses: actions/upload-artifact@v4
        with:
          name: XFC-${{ matrix.config.name }}
          path: ${{ steps.build.outputs.build-output }}

  package:
    name: Package (one .geode for all platforms)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Combine
        id: combine
        uses: geode-sdk/build-geode-mod/combine@main

      - name: Upload combined
        uses: actions/upload-artifact@v4
        with:
          name: XFC-All-Platforms
          path: ${{ steps.combine.outputs.build-output }}
