name: Build XFC 2.2.9

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64
          - name: Android64
            os: ubuntu-latest
            target: Android64
          - name: Android32
            os: ubuntu-latest
            target: Android32

    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v4.10.0
          bindings: geode-sdk/bindings
          bindings-ref: c949aeae063175eca528b33cf8f5b573935b0079
          target: ${{ matrix.config.target }}

      - name: Upload ${{ matrix.config.name }}
        uses: actions/upload-artifact@v4
        with:
          name: XFC-${{ matrix.config.name }}
          path: ${{ steps.build.outputs.build-output }} 
